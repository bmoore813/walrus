# EXAMPLE ONLY — do NOT apply as-is and do NOT commit real credentials.
#
# Copy to secrets.yaml, fill in real connection strings, and create it out-of-band (or via a sealed-
# secret / external-secrets operator). It is intentionally excluded from kustomization.yaml so a
# placeholder never lands in the cluster. Only the three Postgres URLs live here (they embed passwords);
# S3 credentials are NOT here — they come from IRSA / Workload Identity via the `walrus` ServiceAccount.
#
#   kubectl create secret generic walrus-secrets \
#     --from-literal=WALRUS_CONTROL_DB_URL='postgres://walrus:...@control-pg:5432/walrus_control' \
#     --from-literal=WALRUS_DUCKLAKE_CATALOG_URL='postgres://walrus:...@catalog-pg:5432/walrus_ducklake' \
#     --from-literal=WALRUS_SOURCE_DB_URL='postgres://walrus:...@source-pg:5432/walrus'
apiVersion: v1
kind: Secret
metadata:
  name: walrus-secrets
  labels:
    app.kubernetes.io/name: walrus
type: Opaque
stringData:
  # Control plane: manifest / checkpoint / registry writes (extractor + transformer).
  WALRUS_CONTROL_DB_URL: "postgres://REPLACE_ME:REPLACE_ME@control-pg:5432/walrus_control"
  # Dedicated DuckLake metadata catalog (transformer writer role).
  WALRUS_DUCKLAKE_CATALOG_URL: "postgres://REPLACE_ME:REPLACE_ME@catalog-pg:5432/walrus_ducklake"
  # Source database used by both the source-init Job and extractor in this base. The init Job needs source-
  # admin rights (normally superuser for CREATE EVENT TRIGGER) plus publication/table ownership. The
  # running extractor needs REPLICATION, SELECT on every published user and walrus table, INSERT on
  # public.walrus_reload_event, UPDATE on public.walrus_heartbeat, and enough target-table privilege for its reload
  # fence lock. Split the Job onto a separate admin Secret to keep the runtime role least-privileged.
  WALRUS_SOURCE_DB_URL: "postgres://REPLACE_ME:REPLACE_ME@source-pg:5432/walrus"
